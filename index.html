<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- iOS 홈 화면 추가를 위한 메타태그 (웹앱) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="군생활D">
    <!-- SVG Data URI를 사용한 아이콘 생성 (홈 화면 추가 시 이모지 아이콘이 뜹니다) -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%2310b981' width='100' height='100' rx='22'/><text x='50' y='68' font-size='50' text-anchor='middle' fill='white'>🫡</text></svg>">
    
    <title>밀리터리 대시보드 - 전역일/월급일/연휴 계산기</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Noto Sans KR', 'sans-serif'],
                        heading: ['Black Han Sans', 'sans-serif'],
                    },
                    colors: {
                        milGreen: '#10b981', 
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
            position: relative;
            overflow-x: hidden;
            min-height: 100vh;
        }
        
        /* 리퀴드 배경 */
        .liquid-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: -1;
            background: linear-gradient(45deg, #0f172a, #1e1b4b, #022c22, #0f172a);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }
        
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .blob {
            position: absolute;
            filter: blur(60px);
            border-radius: 50%;
            opacity: 0.5;
            animation: float 10s infinite ease-in-out;
            z-index: -1;
        }
        .blob-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: #3b82f6; }
        .blob-2 { bottom: -10%; right: -10%; width: 60vw; height: 60vw; background: #10b981; animation-delay: -5s; }
        .blob-3 { top: 40%; left: 30%; width: 40vw; height: 40vw; background: #8b5cf6; animation-delay: -2s; opacity: 0.3; }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(30px) scale(1.1); }
        }

        /* Glassmorphism 패널 */
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }
        
        .glass-input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
        }
        .glass-input:focus {
            border-color: rgba(16, 185, 129, 0.8);
            outline: none;
        }

        .progress-bar-fill { transition: width 1.5s cubic-bezier(0.2, 0.8, 0.2, 1); }
        ::-webkit-scrollbar { display: none; }
        
        /* 체크박스 커스텀 */
        .custom-checkbox:checked + div {
            background-color: #10b981;
            border-color: #10b981;
        }
        .custom-checkbox:checked + div svg { display: block; }
        
        .line-through-custom {
            text-decoration: line-through;
            color: #94a3b8;
        }
    </style>
</head>
<body class="p-4 md:p-6 pb-20 flex justify-center text-slate-100">

    <div class="liquid-bg"></div>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="w-full max-w-md mx-auto space-y-6 relative z-10">
        
        <!-- 헤더 및 타이틀 -->
        <header class="relative flex flex-col items-center justify-center pt-8 pb-4 text-center">
            <h1 class="text-4xl md:text-5xl font-heading tracking-wider text-white drop-shadow-[0_0_12px_rgba(255,255,255,0.4)] leading-tight mb-2">
                나의 군생활<br>대시보드
            </h1>
            <!-- 랜덤 동기부여 문구 -->
            <p id="quote-display" class="text-sm text-emerald-300 font-medium mt-2 mb-3 h-5"></p>
            
            <p class="text-xs text-slate-300 font-medium bg-black/30 px-4 py-1.5 rounded-full backdrop-blur-sm" id="current-date-display">오늘 날짜 로딩중...</p>
            
            <button onclick="toggleSettings()" class="absolute top-4 right-0 p-2.5 glass-panel rounded-full hover:bg-white/10 transition" aria-label="설정">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
            </button>
        </header>

        <div id="settings-panel" class="hidden glass-panel rounded-3xl p-6 transition-all">
            <h2 class="text-xl font-heading mb-4 text-white flex items-center">
                ⚙️ 기본 설정
            </h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm text-slate-300 mb-1.5">입대일</label>
                    <input type="date" id="enlist-date" class="w-full glass-input rounded-xl p-3">
                </div>
                <div>
                    <label class="block text-sm text-slate-300 mb-1.5">전역일</label>
                    <input type="date" id="discharge-date" class="w-full glass-input rounded-xl p-3">
                </div>
                <div>
                    <label class="block text-sm text-slate-300 mb-1.5">월 적금액 (원)</label>
                    <input type="number" id="saving-amount" class="w-full glass-input rounded-xl p-3" placeholder="예: 400000" value="400000">
                </div>
                <button onclick="saveSettings()" class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 text-white font-bold py-3.5 rounded-xl shadow-[0_0_15px_rgba(16,185,129,0.4)] mt-2">
                    저장하기
                </button>
            </div>
        </div>

        <!-- 1. 전역 디데이 카드 -->
        <div class="glass-panel rounded-3xl p-7 relative overflow-hidden">
            <h2 class="text-sm font-semibold text-slate-300 mb-2">전역까지</h2>
            <div class="flex items-baseline space-x-2 mb-4">
                <span id="dday-main" class="text-6xl font-heading text-white drop-shadow-md">D-?</span>
                <span id="dday-sub" class="text-lg text-slate-300">...</span>
            </div>

            <div class="mb-2 flex justify-between text-sm font-medium">
                <span class="text-emerald-400 font-bold" id="percent-text">0.00%</span>
                <span class="text-slate-300" id="days-info">0일 / 0일</span>
            </div>
            
            <div class="w-full bg-black/40 rounded-full h-4 mb-4 overflow-hidden border border-white/5">
                <div id="progress-bar" class="bg-gradient-to-r from-emerald-400 via-teal-400 to-cyan-400 h-4 rounded-full progress-bar-fill relative" style="width: 0%">
                    <div class="absolute top-0 left-0 w-full h-full bg-white/20 rounded-full"></div>
                </div>
            </div>
            
            <div class="flex justify-between text-xs text-slate-400 font-medium bg-black/20 p-3 rounded-xl">
                <span id="enlist-display">입대: -</span>
                <span id="discharge-display">전역: -</span>
            </div>
        </div>

        <!-- 2. 진급 디데이 카드 -->
        <div class="glass-panel rounded-3xl p-5 md:p-6">
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center space-x-3">
                    <div class="text-2xl">🎖️</div>
                    <h3 class="font-bold text-slate-200">나의 계급</h3>
                </div>
                <span id="current-rank" class="bg-blue-500/30 text-blue-300 px-3 py-1 rounded-full text-sm font-bold border border-blue-500/30">계산중</span>
            </div>
            
            <div class="mb-2 flex justify-between text-sm">
                <span class="text-slate-300">다음 진급: <strong id="next-rank" class="text-white">?</strong></span>
                <span id="rank-dday" class="text-emerald-400 font-bold">D-?</span>
            </div>
            
            <div class="w-full bg-black/40 rounded-full h-2 overflow-hidden">
                <div id="rank-progress" class="bg-blue-400 h-full rounded-full progress-bar-fill" style="width: 0%"></div>
            </div>
        </div>

        <!-- 4분할 위젯 영역 -->
        <div class="grid grid-cols-2 gap-4">
            
            <!-- 3. 월급날 위젯 -->
            <div class="glass-panel rounded-2xl p-4 md:p-5 flex flex-col justify-between">
                <div class="flex items-center space-x-2 mb-3">
                    <span class="text-xl">💰</span>
                    <h3 class="font-bold text-slate-200 text-sm">월급날</h3>
                </div>
                <div>
                    <div id="payday-dday" class="text-3xl font-heading text-white">D-?</div>
                    <div id="payday-date" class="text-xs text-slate-400 mt-1">매월 10일</div>
                </div>
            </div>

            <!-- 4. 부대 날씨 위젯 (가상) -->
            <div class="glass-panel rounded-2xl p-4 md:p-5 flex flex-col justify-between bg-gradient-to-br from-blue-900/40 to-black/5">
                <div class="flex items-center space-x-2 mb-2">
                    <span class="text-xl" id="weather-icon">🌤️</span>
                    <h3 class="font-bold text-slate-200 text-sm">부대 날씨</h3>
                </div>
                <div>
                    <div id="weather-temp" class="text-2xl font-bold text-white">24°C</div>
                    <div id="weather-desc" class="text-xs text-slate-300 mt-1">맑음 (훈련하기 좋은 날)</div>
                </div>
            </div>

            <!-- 5. 다음 연휴 위젯 -->
            <div class="glass-panel rounded-2xl p-4 md:p-5 flex flex-col justify-between">
                <div class="flex items-center space-x-2 mb-3">
                    <span class="text-xl">📅</span>
                    <h3 class="font-bold text-slate-200 text-sm">다음 연휴</h3>
                </div>
                <div>
                    <div id="holiday-dday" class="text-3xl font-heading text-white">D-?</div>
                    <div id="holiday-name" class="text-xs text-slate-400 mt-1 truncate">계산중...</div>
                </div>
            </div>

            <!-- 6. 군적금 현황판 -->
            <div class="glass-panel rounded-2xl p-4 md:p-5 flex flex-col justify-between">
                <div class="flex items-center space-x-2 mb-2">
                    <span class="text-xl">🏦</span>
                    <h3 class="font-bold text-slate-200 text-sm">적금 현황</h3>
                </div>
                <div>
                    <div class="text-xs text-slate-400">모인 원금</div>
                    <div id="saved-money" class="text-lg font-bold text-emerald-400 truncate">0원</div>
                    <div class="text-[10px] text-slate-500 mt-0.5" id="expected-money">전역 시 예상: 0원</div>
                </div>
            </div>

        </div>

        <!-- 7. PX 메모장 (체크리스트) -->
        <div class="glass-panel rounded-3xl p-5 md:p-6">
            <h3 class="font-bold text-slate-200 mb-4 flex items-center">
                <span class="text-xl mr-2">🛒</span> PX 쇼핑 리스트
            </h3>
            
            <form id="memo-form" class="flex mb-4" onsubmit="addMemo(event)">
                <input type="text" id="memo-input" class="flex-1 glass-input rounded-l-xl p-3 text-sm" placeholder="필요한 물품을 적어보세요" required>
                <button type="submit" class="bg-emerald-500 hover:bg-emerald-600 px-4 rounded-r-xl text-white font-bold transition">추가</button>
            </form>
            
            <ul id="memo-list" class="space-y-2 max-h-48 overflow-y-auto pr-2">
                <!-- 렌더링 될 리스트 아이템 -->
            </ul>
        </div>
        
    </div>

    <script>
        // 동기부여 문구 배열
        const QUOTES = [
            "국방부 시계는 오늘도 돌아갑니다 ⏳",
            "피할 수 없다면 즐겨라! (근데 피하고 싶다) 😂",
            "오늘 하루도 무사히, 안전 제일! 🛡️",
            "지금 흘린 땀방울이 전역증을 만듭니다 💦",
            "전역이 안 올 것 같죠? 옵니다. 🏃",
            "수고했어 오늘도 🌙",
            "짬은 시간이 해결해준다 🍚"
        ];

        // 가상 날씨 데이터 생성기
        const WEATHER_TYPES = [
            { icon: "☀️", temp: "26°C", desc: "맑음 (작업하기 좋은 날)" },
            { icon: "🌤️", temp: "22°C", desc: "구름조금 (연병장 뜀걸음)" },
            { icon: "☁️", temp: "18°C", desc: "흐림 (비 오길 기도...)" },
            { icon: "🌧️", temp: "15°C", desc: "비 (실내 교육장 대기)" }
        ];

        const HOLIDAYS = [
            { name: "크리스마스", date: "2026-12-25" },
            { name: "신정", date: "2027-01-01" },
            { name: "설날 연휴", date: "2027-02-06" },
            { name: "삼일절", date: "2027-03-01" },
            { name: "어린이날", date: "2027-05-05" },
            { name: "부처님오신날", date: "2027-05-13" },
            { name: "현충일", date: "2027-06-06" },
            { name: "광복절", date: "2027-08-15" }
        ];

        function getDaysDiff(date1, date2) {
            const d1 = new Date(date1.getFullYear(), date1.getMonth(), date1.getDate());
            const d2 = new Date(date2.getFullYear(), date2.getMonth(), date2.getDate());
            return Math.ceil((d2.getTime() - d1.getTime()) / (1000 * 60 * 60 * 24));
        }

        function formatDate(dateString) {
            if (!dateString) return "-";
            const d = new Date(dateString);
            return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;
        }

        function formatMoney(num) {
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",") + "원";
        }

        // 숫자 카운트업 애니메이션 (퍼센트용)
        function animateValue(id, start, end, duration) {
            const obj = document.getElementById(id);
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                const easeProgress = 1 - Math.pow(1 - progress, 3);
                const currentVal = (easeProgress * (end - start) + start);
                
                obj.textContent = `${currentVal.toFixed(2)}%`;
                
                if (progress < 1) window.requestAnimationFrame(step);
                else obj.textContent = `${end.toFixed(2)}%`;
            };
            window.requestAnimationFrame(step);
        }

        function init() {
            // 1. 랜덤 문구 표시
            const randomQuote = QUOTES[Math.floor(Math.random() * QUOTES.length)];
            document.getElementById('quote-display').textContent = randomQuote;

            // 2. 가상 날씨 세팅
            const randomWeather = WEATHER_TYPES[Math.floor(Math.random() * WEATHER_TYPES.length)];
            document.getElementById('weather-icon').textContent = randomWeather.icon;
            document.getElementById('weather-temp').textContent = randomWeather.temp;
            document.getElementById('weather-desc').textContent = randomWeather.desc;

            // 날짜 세팅
            const today = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' };
            document.getElementById('current-date-display').textContent = today.toLocaleDateString('ko-KR', options);

            const savedEnlist = localStorage.getItem('mil_enlist_date');
            const savedDischarge = localStorage.getItem('mil_discharge_date');
            const savedAmount = localStorage.getItem('mil_saving_amount') || 400000;

            document.getElementById('saving-amount').value = savedAmount;

            if (savedEnlist && savedDischarge) {
                document.getElementById('enlist-date').value = savedEnlist;
                document.getElementById('discharge-date').value = savedDischarge;
                updateDashboard(savedEnlist, savedDischarge, savedAmount, today);
            } else {
                document.getElementById('settings-panel').classList.remove('hidden');
                document.getElementById('dday-main').textContent = "설정필요";
                document.getElementById('dday-sub').textContent = "";
            }

            calculatePayday(today);
            calculateNextHoliday(today);
            renderMemos();
        }

        function updateDashboard(enlistStr, dischargeStr, savingAmount, today) {
            const enlistDate = new Date(enlistStr);
            const dischargeDate = new Date(dischargeStr);
            const amt = parseInt(savingAmount);

            document.getElementById('enlist-display').textContent = `입대: ${formatDate(enlistStr)}`;
            document.getElementById('discharge-display').textContent = `전역: ${formatDate(dischargeStr)}`;

            const totalDays = getDaysDiff(enlistDate, dischargeDate);
            const servedDays = getDaysDiff(enlistDate, today);
            const remainingDays = getDaysDiff(today, dischargeDate);

            let percent = (servedDays / totalDays) * 100;
            
            if (servedDays < 0) {
                percent = 0;
                document.getElementById('dday-main').textContent = `D-${Math.abs(servedDays)}`;
                document.getElementById('dday-sub').textContent = "입대 전";
                document.getElementById('days-info').textContent = `총 ${totalDays}일 예정`;
            } else if (remainingDays <= 0) {
                percent = 100;
                document.getElementById('dday-main').textContent = `D+${Math.abs(remainingDays)}`;
                document.getElementById('dday-sub').textContent = "전역!";
                document.getElementById('days-info').textContent = `복무 완료`;
            } else {
                document.getElementById('dday-main').textContent = `D-${remainingDays}`;
                document.getElementById('dday-sub').textContent = "남음";
                document.getElementById('days-info').textContent = `총 ${totalDays}일 중 ${remainingDays}일 남음`;
            }

            animateValue("percent-text", 0, Math.max(0, Math.min(percent, 100)), 1500);
            
            setTimeout(() => {
                document.getElementById('progress-bar').style.width = `${Math.min(Math.max(percent, 0), 100)}%`;
            }, 50);

            // 진급 및 적금 로직 호출
            calculateRank(enlistDate, today);
            calculateSavings(enlistDate, dischargeDate, today, amt);
        }

        // 육군 기준 진급 (2-6-6-나머지)
        function calculateRank(enlistDate, today) {
            const pfc = new Date(enlistDate.getFullYear(), enlistDate.getMonth() + 2, enlistDate.getDate()); // 일병
            const cpl = new Date(pfc.getFullYear(), pfc.getMonth() + 6, pfc.getDate()); // 상병
            const sgt = new Date(cpl.getFullYear(), cpl.getMonth() + 6, cpl.getDate()); // 병장

            let currentRank, nextRankStr, nextRankDate, prevRankDate;

            if (today < enlistDate) {
                currentRank = "입대 전"; nextRankStr = "이병"; nextRankDate = enlistDate; prevRankDate = today;
            } else if (today < pfc) {
                currentRank = "이병"; nextRankStr = "일병"; nextRankDate = pfc; prevRankDate = enlistDate;
            } else if (today < cpl) {
                currentRank = "일병"; nextRankStr = "상병"; nextRankDate = cpl; prevRankDate = pfc;
            } else if (today < sgt) {
                currentRank = "상병"; nextRankStr = "병장"; nextRankDate = sgt; prevRankDate = cpl;
            } else {
                currentRank = "병장"; nextRankStr = "전역"; nextRankDate = new Date(localStorage.getItem('mil_discharge_date')); prevRankDate = sgt;
            }

            document.getElementById('current-rank').textContent = currentRank;
            document.getElementById('next-rank').textContent = nextRankStr;

            const daysToNext = getDaysDiff(today, nextRankDate);
            document.getElementById('rank-dday').textContent = `D-${daysToNext}`;

            const totalRankDays = getDaysDiff(prevRankDate, nextRankDate);
            const servedRankDays = getDaysDiff(prevRankDate, today);
            let rankPercent = (servedRankDays / totalRankDays) * 100;
            if (rankPercent > 100) rankPercent = 100;
            if (rankPercent < 0) rankPercent = 0;

            setTimeout(() => {
                document.getElementById('rank-progress').style.width = `${rankPercent}%`;
            }, 300);
        }

        function calculateSavings(enlistDate, dischargeDate, today, monthlyAmount) {
            let monthsServed = (today.getFullYear() - enlistDate.getFullYear()) * 12 + (today.getMonth() - enlistDate.getMonth());
            if (today.getDate() < enlistDate.getDate()) monthsServed--; // 입대일 날짜를 안 지났으면 차감
            if (monthsServed < 0) monthsServed = 0;

            let totalMonths = (dischargeDate.getFullYear() - enlistDate.getFullYear()) * 12 + (dischargeDate.getMonth() - enlistDate.getMonth());

            const currentSaved = monthsServed * monthlyAmount;
            // 2024년 이후 장병내일준비적금은 정부매칭지원금 100% (원금의 2배 가량)
            const expectedTotal = (totalMonths * monthlyAmount) * 2; 

            document.getElementById('saved-money').textContent = formatMoney(currentSaved);
            document.getElementById('expected-money').textContent = `전역 시 예상(매칭포함): ${formatMoney(expectedTotal)}`;
        }

        function calculatePayday(today) {
            let nextPayday;
            if (today.getDate() <= 10) {
                nextPayday = new Date(today.getFullYear(), today.getMonth(), 10);
            } else {
                nextPayday = new Date(today.getFullYear(), today.getMonth() + 1, 10);
            }
            const diff = getDaysDiff(today, nextPayday);
            
            const paydayEl = document.getElementById('payday-dday');
            if (diff === 0) {
                paydayEl.textContent = "D-Day!";
                paydayEl.classList.add('text-yellow-400');
            } else {
                paydayEl.textContent = `D-${diff}`;
                paydayEl.classList.remove('text-yellow-400');
            }
        }

        function calculateNextHoliday(today) {
            const todayReset = new Date(today.getFullYear(), today.getMonth(), today.getDate());
            let nextHoliday = null;
            let daysLeft = -1;

            for (let i = 0; i < HOLIDAYS.length; i++) {
                const holidayDate = new Date(HOLIDAYS[i].date);
                if (holidayDate >= todayReset) {
                    nextHoliday = HOLIDAYS[i];
                    daysLeft = getDaysDiff(todayReset, holidayDate);
                    break;
                }
            }

            if (nextHoliday) {
                document.getElementById('holiday-dday').textContent = daysLeft === 0 ? "D-Day!" : `D-${daysLeft}`;
                document.getElementById('holiday-name').textContent = `${nextHoliday.name}`;
            }
        }

        function toggleSettings() {
            document.getElementById('settings-panel').classList.toggle('hidden');
        }

        function saveSettings() {
            const enlistStr = document.getElementById('enlist-date').value;
            const dischargeStr = document.getElementById('discharge-date').value;
            const savingAmount = document.getElementById('saving-amount').value;

            if (!enlistStr || !dischargeStr) return alert("날짜를 입력해주세요.");
            if (new Date(enlistStr) >= new Date(dischargeStr)) return alert("전역일 오류");

            localStorage.setItem('mil_enlist_date', enlistStr);
            localStorage.setItem('mil_discharge_date', dischargeStr);
            localStorage.setItem('mil_saving_amount', savingAmount);
            
            updateDashboard(enlistStr, dischargeStr, savingAmount, new Date());
            toggleSettings();
        }

        /* PX 메모장 기능 (로컬스토리지 활용) */
        let memos = JSON.parse(localStorage.getItem('mil_memos')) || [];

        function renderMemos() {
            const list = document.getElementById('memo-list');
            list.innerHTML = '';
            
            if(memos.length === 0) {
                list.innerHTML = '<li class="text-xs text-slate-400 text-center py-2">메모가 없습니다.</li>';
                return;
            }

            memos.forEach((memo, index) => {
                const li = document.createElement('li');
                li.className = 'flex items-center justify-between bg-black/20 p-3 rounded-xl border border-white/5';
                
                li.innerHTML = `
                    <label class="flex items-center cursor-pointer flex-1 overflow-hidden">
                        <div class="relative flex items-center justify-center w-5 h-5 mr-3">
                            <input type="checkbox" class="custom-checkbox opacity-0 absolute h-full w-full cursor-pointer z-10" ${memo.checked ? 'checked' : ''} onchange="toggleMemo(${index})">
                            <div class="w-full h-full border border-slate-500 rounded flex items-center justify-center transition-colors">
                                <svg class="w-3 h-3 text-white hidden pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                            </div>
                        </div>
                        <span class="text-sm font-medium truncate ${memo.checked ? 'line-through-custom' : 'text-slate-200'}">${memo.text}</span>
                    </label>
                    <button onclick="deleteMemo(${index})" class="text-slate-500 hover:text-red-400 ml-2 p-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                `;
                list.appendChild(li);
            });
        }

        function addMemo(e) {
            e.preventDefault();
            const input = document.getElementById('memo-input');
            const text = input.value.trim();
            
            if (text) {
                memos.push({ text, checked: false });
                localStorage.setItem('mil_memos', JSON.stringify(memos));
                input.value = '';
                renderMemos();
            }
        }

        function toggleMemo(index) {
            memos[index].checked = !memos[index].checked;
            localStorage.setItem('mil_memos', JSON.stringify(memos));
            renderMemos();
        }

        function deleteMemo(index) {
            memos.splice(index, 1);
            localStorage.setItem('mil_memos', JSON.stringify(memos));
            renderMemos();
        }

        window.onload = init;
    </script>
</body>
</html>
